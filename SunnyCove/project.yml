name: SunnyCove
options:
  bundleIdPrefix: com.sunnycove
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
targets:
  SunnyCove:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    frameworks:
      - WebKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunnycove.game
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Sunny Cove
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ContentManifestURL: ""
        ContentVersion: 2026.07.0
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
  SunnyCoveTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    dependencies:
      - target: SunnyCove
schemes:
  SunnyCove:
    build:
      targets:
        SunnyCove: all
        SunnyCoveTests: [test]
    test:
      targets:
        - SunnyCoveTests
