name: Build Sunny Cove IPA

on:
  workflow_dispatch:
  push:
    branches: [main, "codex/**"]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app and tests
        run: xcodebuild build-for-testing -project SunnyCove.xcodeproj -scheme SunnyCove -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Run unit tests
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime, devices in data["devices"].items() if "iOS" in runtime for device in devices if device.get("isAvailable") and device["name"].startswith("iPhone")))')
          xcrun simctl boot "$SIMULATOR_ID" || true
          xcrun simctl bootstatus "$SIMULATOR_ID" -b
          xcodebuild test-without-building -project SunnyCove.xcodeproj -scheme SunnyCove -destination "platform=iOS Simulator,id=$SIMULATOR_ID" CODE_SIGNING_ALLOWED=NO
      - name: Archive unsigned app
        run: xcodebuild archive -project SunnyCove.xcodeproj -scheme SunnyCove -archivePath build/SunnyCove.xcarchive -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R build/SunnyCove.xcarchive/Products/Applications/SunnyCove.app build/Payload/
          cd build
          zip -qry SunnyCove-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: SunnyCove-unsigned-ipa
          path: build/SunnyCove-unsigned.ipa
